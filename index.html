<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanChat Ultimate v7.2 - Voice with TTS Subtitles</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg: #0b0d0f;
            --panel: #16191d; 
            --accent: #00ff88; 
            --text: #ffffff; 
            --side-w: 320px; 
            --error: #ff4444; 
            --blue: #0078ff; 
        }

        * { box-sizing: border-box; outline: none; }

        body { 
            margin: 0;
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        #sidebar { 
            width: 320px;
            background: var(--panel); 
            border-right: 1px solid #2d3239; 
            display: flex; 
            flex-direction: column; 
            z-index: 100;
        }

        .top-nav { 
            padding: 20px;
            display: flex; 
            gap: 18px; 
            border-bottom: 1px solid #2d3239; 
            align-items: center; 
        }

        .nav-icon { 
            font-size: 20px;
            cursor: pointer; 
            opacity: 0.7; 
            transition: all 0.3s ease; 
        }

        .nav-icon:hover { 
            opacity: 1;
            transform: scale(1.2); 
            color: var(--accent);
        }

        #contact-list { flex: 1; overflow-y: auto; }

        .contact-item { 
            padding: 15px 20px;
            border-bottom: 1px solid #1f2329; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: 0.2s;
        }

        .contact-item:hover { background: #1c2127; border-left: 3px solid var(--accent); }

        .contact-item img { 
            width: 46px;
            height: 46px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid #2d3239; 
        }

        .contact-info { flex: 1; }
        .contact-info b { display: block; font-size: 15px; }

        .status-dot { font-size: 10px; font-weight: bold; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        .status-dot::before { content: '●'; }
        .on { color: var(--accent); } 
        .off { color: #555; }

        #main-content { 
            flex: 1;
            display: flex; 
            flex-direction: column; 
            background: #0f1216; 
        }

        header { 
            background: var(--panel);
            padding: 15px 30px; 
            border-bottom: 1px solid #2d3239; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer;
        }

        #chat-window { 
            flex: 1;
            overflow-y: auto; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .msg-row { display: flex; gap: 12px; max-width: 80%; animation: msgSlide 0.4s ease; }
        .msg-row.me { flex-direction: row-reverse; align-self: flex-end; }
        
        .msg-av { 
            width: 40px;
            height: 40px; 
            border-radius: 12px; 
            cursor: pointer; 
            object-fit: cover; 
        }

        .msg-content { 
            padding: 12px 18px;
            border-radius: 18px; 
            background: #23282e; 
            font-size: 14.5px;
            line-height: 1.5;
        }

        .me .msg-content { background: var(--blue); color: #fff; }

        #voice-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            background: #12161b; 
            border-bottom: 2px solid var(--accent);
            max-height: 280px; 
            overflow-y: auto;
        }

        .voice-card { 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            gap: 10px; 
            position: relative; 
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .voice-av { 
            width: 80px;
            height: 80px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #2d3239; 
            transition: 0.3s;
        }

        .speaking .voice-av { 
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent); 
            transform: scale(1.1); 
        }

        .custom-modal { 
            position: fixed;
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 5000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(10px);
        }

        .win-frame { 
            background: var(--panel);
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid var(--accent); 
            text-align: center; 
            width: 420px; 
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        #input-area { 
            padding: 20px;
            background: var(--panel); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border-top: 1px solid #2d3239;
        }

        .inp { 
            flex: 1;
            padding: 14px 20px; 
            background: #0b0d0f; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 12px; 
            font-size: 15px;
        }

        .inp:focus { border-color: var(--accent); }

        .btn { 
            padding: 12px 25px;
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            font-weight: 800; 
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn:active { transform: scale(0.95); }

        #ctx-menu { 
            position: fixed;
            background: #1c2127; 
            border: 1px solid #444; 
            border-radius: 12px; 
            z-index: 10000; 
            display: none; 
            min-width: 200px;
        }

        .ctx-item { padding: 14px 20px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #2d3239; }
        .ctx-item:hover { background: var(--accent); color: #000; }

        .subtitles-area {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            border-left: 4px solid var(--accent);
            border-right: 4px solid var(--accent);
            font-size: 16px;
            font-weight: 500;
            max-width: 80%;
            text-align: center;
            z-index: 2000;
            display: none;
            pointer-events: none;
            font-family: monospace;
        }

        .tts-toggle {
            background: #2d3239;
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .tts-toggle.active {
            background: var(--accent);
            color: #000;
        }

        @keyframes msgSlide { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        .hidden { display: none !important; }

        .tool-btn {
            font-size: 24px;
            cursor: pointer;
            background: #2d3239;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
        }
        .tool-btn:hover { background: var(--accent); color: #000; }

        .contact-invite-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }
        .contact-invite-item:hover {
            background: #1c2127;
            border-left: 3px solid var(--accent);
        }
    </style>
</head>
<body onclick="closeCtx()" oncontextmenu="return false;">

    <div id="auth-screen" style="position:fixed; inset:0; background:var(--bg); z-index:20000; display:flex; align-items:center; justify-content:center;">
        <div class="win-frame">
            <h1 style="color:var(--accent); letter-spacing:5px;">DANCHAT</h1>
            <p style="opacity:0.5; margin-bottom:30px;">VOICE + TTS SUBTITLES</p>
            <input type="text" id="auth-n" class="inp" placeholder="ЛОГИН" style="margin-bottom:15px; width:100%">
            <input type="password" id="auth-p" class="inp" placeholder="ПАРОЛЬ" style="width:100%; margin-bottom:25px;">
            <button class="btn" style="background:var(--accent); color:#000; width:100%" onclick="auth()">ВХОД</button>
        </div>
    </div>

    <div id="settings-modal" class="custom-modal">
        <div class="win-frame">
            <h3>НАСТРОЙКИ</h3>
            <img id="set-pre" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--accent); object-fit:cover; margin: 15px auto;">
            <input type="file" id="f-set" class="hidden" onchange="preview(this, 'set-pre')">
            <button class="btn" style="background:#333; color:#fff; font-size:11px; margin-bottom:20px;" onclick="document.getElementById('f-set').click()">ФОТО</button>
            <div style="text-align:left; margin-bottom:20px;">
                <label style="color:var(--accent)">ЦВЕТ:</label>
                <input type="color" id="set-color" style="width:100%; height:40px; margin-top:5px;">
            </div>
            <div style="text-align:left; margin-bottom:25px;">
                <label style="color:var(--accent)">ADMIN KEY:</label>
                <input type="password" id="admin-key" class="inp" style="width:100%; margin-top:5px;">
            </div>
            <button class="btn" style="background:var(--accent); color:#000; width:100%" onclick="saveSettings()">СОХРАНИТЬ</button>
            <button class="btn" style="background:transparent; color:#555; width:100%; margin-top:10px;" onclick="hideModal('settings-modal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="group-modal" class="custom-modal">
        <div class="win-frame">
            <h3>СОЗДАНИЕ ГРУППЫ</h3>
            <img id="group-avatar-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:80px; height:80px; border-radius:50%; margin-bottom:15px; border:2px solid var(--accent); cursor:pointer; object-fit:cover;" onclick="document.getElementById('group-avatar-input').click()">
            <input type="file" id="group-avatar-input" class="hidden" accept="image/*" onchange="previewGroupAvatar(this)">
            <input type="text" id="g-name" class="inp" placeholder="Название" style="width:100%; margin-bottom:20px;">
            <button class="btn" style="background:var(--accent); color:#000; width:100%" onclick="createGroup()">СОЗДАТЬ</button>
            <button class="btn" style="margin-top:10px; background:transparent; color:#555" onclick="hideModal('group-modal')">ОТМЕНА</button>
        </div>
    </div>

    <div id="members-modal" class="custom-modal">
        <div class="win-frame" style="width:450px;">
            <h3 id="mem-h">УЧАСТНИКИ</h3>
            <div id="mem-list" style="max-height:380px; overflow-y:auto; text-align:left;"></div>
            <button class="btn" style="margin-top:20px; background:var(--error); color:#fff" onclick="hideModal('members-modal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="poll-modal" class="custom-modal">
        <div class="win-frame">
            <h3>ОПРОС</h3>
            <input type="text" id="poll-q" class="inp" placeholder="Вопрос" style="width:100%; margin-bottom:15px;">
            <div id="poll-opts-container">
                <input type="text" class="inp poll-opt-in" placeholder="Вариант 1" style="width:100%; margin-bottom:10px;">
                <input type="text" class="inp poll-opt-in" placeholder="Вариант 2" style="width:100%; margin-bottom:10px;">
            </div>
            <button class="btn" style="background:#333; width:100%; margin-bottom:15px;" onclick="addPollOption()">+ ДОБАВИТЬ</button>
            <button class="btn" style="background:var(--accent); color:#000; width:100%" onclick="publishPoll()">ОПУБЛИКОВАТЬ</button>
            <button class="btn" style="margin-top:10px; background:transparent; color:#555" onclick="hideModal('poll-modal')">ОТМЕНА</button>
        </div>
    </div>

    <div id="sidebar" class="hidden">
        <div class="top-nav">
            <span class="nav-icon" onclick="showModal('settings-modal')">⚙️</span>
            <span class="nav-icon" onclick="openSearch()">👤</span>
            <span class="nav-icon" onclick="showModal('group-modal')">➕</span>
            <div id="my-name-display" style="margin-left:auto; font-weight:bold;"></div>
        </div>
        <div id="contact-list"></div>
    </div>

    <div id="main-content" class="hidden">
        <header onclick="openChatInfo()">
            <div>
                <b id="chat-title" style="font-size:18px;">ЗАГРУЗКА...</b><br>
                <small id="chat-stat" style="opacity:0.6"></small>
            </div>
            <div style="display:flex; gap:15px;">
                <button id="tts-toggle-btn" class="tts-toggle" onclick="event.stopPropagation(); toggleTTS()">🔊 ОЗВУЧКА СУБТИТРОВ ВКЛ</button>
                <span id="admin-indicator" class="hidden" style="color:var(--error); font-size:11px;">[ADMIN]</span>
                <button id="v-join-btn" onclick="event.stopPropagation(); toggleVoiceChat()" style="background:var(--blue); border:none; padding:10px 20px; border-radius:10px; color:#fff; font-weight:bold; cursor:pointer;">🎤 ВОЙТИ В ГОЛОС</button>
            </div>
        </header>

        <div id="voice-grid" class="hidden"></div>
        <div id="chat-window"></div>

        <div id="action-bar" class="hidden" style="background:#1c2127; padding:12px 25px; border-top:3px solid var(--accent); display:flex; justify-content:space-between;">
            <div>
                <b id="action-type" style="color:var(--accent);">Действие</b>
                <span id="action-text" style="font-size:13px;"></span>
            </div>
            <span onclick="cancelAction()" style="cursor:pointer; color:var(--error); font-size:22px;">✕</span>
        </div>

        <div id="input-area">
            <span class="tool-btn" onclick="showModal('emoji-picker')">😊</span>
            <input type="file" id="msg-img" class="hidden" onchange="uploadImage(this)">
            <span class="tool-btn" onclick="document.getElementById('msg-img').click()">📷</span>
            <span class="tool-btn" onclick="showModal('poll-modal')">＋</span>
            <input type="text" id="msg-in" class="inp" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') send()">
            <button class="btn" style="background:var(--accent); color:#000" onclick="send()">ОТПРАВИТЬ</button>
        </div>
    </div>

    <div id="emoji-picker" class="custom-modal" onclick="this.style.display='none'">
        <div class="win-frame" onclick="event.stopPropagation()" style="display:grid; grid-template-columns:repeat(4,1fr); gap:15px;">
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('😊')">😊</span>
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('😂')">😂</span>
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('🔥')">🔥</span>
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('❤')">❤</span>
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('👍')">👍</span>
            <span style="font-size:30px; cursor:pointer;" onclick="addEmoji('🤡')">🤡</span>
        </div>
    </div>

    <div id="ctx-menu">
        <div class="ctx-item" onclick="replyMessage()">Ответить</div>
        <div id="owner-tools" class="hidden">
            <div class="ctx-item" onclick="editMessage()">Изменить</div>
            <div class="ctx-item" style="color:var(--error)" onclick="deleteMessage()">Удалить</div>
        </div>
    </div>

    <div id="subtitles" class="subtitles-area"></div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAocmcoBH2Q8_QENuE9AuaGwtDOSSg-WpE", 
            authDomain: "danblox-e209f.firebaseapp.com", 
            databaseURL: "https://danblox-e209f-default-rtdb.firebaseio.com", 
            projectId: "danblox-e209f" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const defAv = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        let myData = null, curChat = 'global', curPeer = '', selId = null, selData = null;
        let isEditing = false, replyData = null, lastSendTime = 0;
        let inVoice = false;
        let mediaStream = null;
        let recognition = null;
        let ttsEnabled = true;
        let subtitlesTimeout = null;
        let groupAvatarBase64 = null;

        function auth() {
            const n = document.getElementById('auth-n').value.trim();
            const p = document.getElementById('auth-p').value.trim();
            if(!n || !p) return;
            db.ref('users/'+n).get().then(snap => {
                if(!snap.exists()) {
                    myData = { nick: n, pass: p, av: defAv, color: '#ffffff', admin: false };
                    db.ref('users/'+n).set(myData);
                } else {
                    if(snap.val().pass !== p) return alert("НЕВЕРНЫЙ ПАРОЛЬ");
                    myData = snap.val();
                }
                startApp();
            });
        }

        function startApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('my-name-display').innerText = myData.nick;
            document.getElementById('my-name-display').style.color = myData.color;
            document.getElementById('admin-indicator').classList.toggle('hidden', !myData.admin);
            db.ref('presence/'+myData.nick).set(true);
            db.ref('presence/'+myData.nick).onDisconnect().remove();
            loadContacts();
            switchChat('global', '🌍 Глобальный чат');
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById('tts-toggle-btn');
            if(ttsEnabled) {
                btn.innerText = "🔊 ОЗВУЧКА СУБТИТРОВ ВКЛ";
                btn.classList.add('active');
            } else {
                btn.innerText = "🔇 ОЗВУЧКА СУБТИТРОВ ВЫКЛ";
                btn.classList.remove('active');
            }
        }

        function speakSubtitle(text, nick) {
            if(!ttsEnabled || !text) return;
            if(window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(`${nick} говорит: ${text}`);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function showSubtitle(text, nick) {
            const subDiv = document.getElementById('subtitles');
            subDiv.innerHTML = `🎤 ${nick}: ${text}`;
            subDiv.style.display = 'block';
            if(subtitlesTimeout) clearTimeout(subtitlesTimeout);
            subtitlesTimeout = setTimeout(() => {
                subDiv.style.display = 'none';
            }, 4000);
            speakSubtitle(text, nick);
        }

        function loadContacts() {
            db.ref(`users/${myData.nick}/friends`).on('value', async snap => {
                const list = document.getElementById('contact-list');
                list.innerHTML = `<div class="contact-item" onclick="switchChat('global','🌍 Глобальный чат')">
                    <div style="font-size:24px;">🌍</div>
                    <div><b>Глобальный чат</b></div>
                </div>`;
                const friends = snap.val() || {};
                for(let fid in friends) {
                    const isGroup = friends[fid] === 'group';
                    const info = await db.ref(isGroup ? 'groups/'+fid : 'users/'+fid).get();
                    if(!info.exists()) continue;
                    const data = info.val();
                    const div = document.createElement('div');
                    div.className = 'contact-item';
                    div.onclick = () => isGroup ? switchChat(fid, data.name) : startPrivateChat(fid);
                    div.innerHTML = `
                        <img src="${data.av || defAv}">
                        <div>
                            <b>${isGroup ? data.name : data.nick}</b>
                            <div class="status-dot ${!isGroup ? (data.online ? 'on' : 'off') : ''}">${!isGroup ? (data.online ? 'ОНЛАЙН' : 'ОФФЛАЙН') : 'GROUP'}</div>
                        </div>
                        <span onclick="event.stopPropagation(); removeFriend('${fid}')" style="color:var(--error); margin-left:auto;">🗑️</span>
                    `;
                    list.appendChild(div);
                    if(!isGroup) {
                        db.ref('presence/'+fid).on('value', p => {
                            const dot = div.querySelector('.status-dot');
                            if(dot) {
                                dot.innerText = p.exists() ? 'ОНЛАЙН' : 'ОФФЛАЙН';
                                dot.className = 'status-dot ' + (p.exists() ? 'on' : 'off');
                            }
                        });
                    }
                }
            });
        }

        async function removeFriend(id) {
            if(confirm("Удалить?")) {
                await db.ref(`users/${myData.nick}/friends/${id}`).remove();
                if(curChat === id) switchChat('global', '🌍 Глобальный чат');
            }
        }

        async function startPrivateChat(target) {
            if(target === myData.nick) return;
            await db.ref(`users/${myData.nick}/friends/${target}`).set('user');
            await db.ref(`users/${target}/friends/${myData.nick}`).set('user');
            switchChat(myData.nick < target ? myData.nick+'_'+target : target+'_'+myData.nick, target);
        }

        function switchChat(id, title) {
            if(inVoice) leaveVoiceChat();
            curChat = id;
            curPeer = (id !== 'global' && !id.startsWith('group_')) ? title : '';
            document.getElementById('chat-title').innerText = title;
            document.getElementById('chat-window').innerHTML = '';
            db.ref('messages/'+id).off();
            db.ref('messages/'+id).on('child_added', s => renderMessage(s.key, s.val()));
            db.ref('messages/'+id).on('child_removed', s => {
                const el = document.getElementById('m-'+s.key);
                if(el) el.remove();
            });
        }

        async function renderMessage(mid, m) {
            const win = document.getElementById('chat-window');
            const row = document.createElement('div');
            row.id = 'm-'+mid;
            row.className = `msg-row ${m.sn === myData.nick ? 'me' : ''}`;
            const user = (await db.ref('users/'+m.sn).get()).val() || { av: defAv, color: '#fff' };
            row.oncontextmenu = (e) => {
                e.preventDefault();
                showContextMenu(e, mid, m);
            };
            row.innerHTML = `
                <img src="${user.av}" class="msg-av" onclick="startPrivateChat('${m.sn}')">
                <div class="msg-content">
                    <b style="color:${user.color}">${m.sn}</b>
                    ${m.rp ? `<div style="font-size:11px; opacity:0.6; border-left:2px solid var(--accent); padding-left:8px;">↪ ${m.rp}</div>` : ''}
                    <div>${m.type === 'img' ? `<img src="${m.txt}" style="max-width:200px; border-radius:10px;">` : m.txt}</div>
                </div>
            `;
            win.appendChild(row);
            win.scrollTop = win.scrollHeight;
        }

        function send() {
            const now = Date.now();
            if(now - lastSendTime < 3000 && !isEditing) return alert("3 секунды!");
            const val = document.getElementById('msg-in').value.trim();
            if(!val && !isEditing) return;
            if(isEditing) {
                db.ref(`messages/${curChat}/${selId}`).update({ txt: val });
                cancelAction();
            } else {
                db.ref('messages/'+curChat).push({
                    sn: myData.nick,
                    txt: val,
                    type: 'text',
                    rp: replyData ? replyData.txt.substring(0,30)+'...' : null,
                    ts: now
                });
                lastSendTime = now;
            }
            document.getElementById('msg-in').value = '';
            cancelAction();
        }

        async function toggleVoiceChat() {
            if(!inVoice) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    inVoice = true;
                    document.getElementById('v-join-btn').innerText = "🎤 ВЫЙТИ";
                    document.getElementById('v-join-btn').style.background = "var(--error)";
                    document.getElementById('voice-grid').classList.remove('hidden');
                    
                    await db.ref(`voice/${curChat}/${myData.nick}`).set({ av: myData.av, speaking: false });
                    db.ref(`voice/${curChat}/${myData.nick}`).onDisconnect().remove();
                    
                    if('webkitSpeechRecognition' in window) {
                        recognition = new webkitSpeechRecognition();
                        recognition.continuous = true;
                        recognition.interimResults = true;
                        recognition.lang = 'ru-RU';
                        
                        recognition.onresult = (event) => {
                            let text = '';
                            for(let i = event.resultIndex; i < event.results.length; i++) {
                                if(event.results[i].isFinal) {
                                    text += event.results[i][0].transcript;
                                }
                            }
                            if(text.trim()) {
                                showSubtitle(text, myData.nick);
                                db.ref(`voice_subtitles/${curChat}`).set({
                                    nick: myData.nick,
                                    text: text,
                                    time: Date.now()
                                });
                            }
                        };
                        
                        recognition.onerror = (e) => console.log("Speech error:", e.error);
                        recognition.start();
                    }
                    
                    detectSpeaking();
                    
                } catch(e) { alert("Нет доступа к микрофону"); }
            } else {
                leaveVoiceChat();
            }
        }

        function detectSpeaking() {
            if(!audioContext && mediaStream) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(mediaStream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                const data = new Uint8Array(analyser.frequencyBinCount);
                let lastState = false;
                
                function check() {
                    if(!inVoice) return;
                    analyser.getByteFrequencyData(data);
                    let sum = 0;
                    for(let i=0; i<data.length; i++) sum += data[i];
                    let speaking = sum / data.length > 15;
                    if(speaking !== lastState) {
                        lastState = speaking;
                        db.ref(`voice/${curChat}/${myData.nick}/speaking`).set(speaking);
                    }
                    requestAnimationFrame(check);
                }
                check();
            }
        }

        function leaveVoiceChat() {
            inVoice = false;
            if(mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            if(recognition) {
                recognition.stop();
                recognition = null;
            }
            if(audioContext) {
                audioContext.close();
                audioContext = null;
            }
            db.ref(`voice/${curChat}/${myData.nick}`).remove();
            document.getElementById('v-join-btn').innerText = "🎤 ВОЙТИ В ГОЛОС";
            document.getElementById('v-join-btn').style.background = "var(--blue)";
            document.getElementById('voice-grid').classList.add('hidden');
        }

        db.ref('voice/'+curChat).on('value', (snap) => {
            const grid = document.getElementById('voice-grid');
            if(!grid) return;
            grid.innerHTML = '';
            if(!snap.exists() || !inVoice) return;
            snap.forEach(child => {
                const data = child.val();
                const card = document.createElement('div');
                card.className = `voice-card ${data.speaking ? 'speaking' : ''}`;
                card.innerHTML = `
                    <img src="${data.av || defAv}" class="voice-av">
                    <div class="voice-nick">${child.key === myData.nick ? 'Я' : child.key}</div>
                `;
                grid.appendChild(card);
            });
        });

        db.ref('voice_subtitles/'+curChat).on('value', (snap) => {
            const sub = snap.val();
            if(sub && sub.nick !== myData.nick && inVoice) {
                showSubtitle(sub.text, sub.nick);
            }
        });

        function addPollOption() {
            const container = document.getElementById('poll-opts-container');
            const inp = document.createElement('input');
            inp.type = "text";
            inp.className = "inp poll-opt-in";
            inp.placeholder = "Вариант " + (container.children.length + 1);
            inp.style.marginBottom = "10px";
            inp.style.width = "100%";
            container.appendChild(inp);
        }

        function publishPoll() {
            const q = document.getElementById('poll-q').value.trim();
            const opts = [];
            document.querySelectorAll('.poll-opt-in').forEach(inp => {
                if(inp.value.trim()) opts.push(inp.value.trim());
            });
            if(!q || opts.length < 2) return alert("Вопрос и 2+ варианта!");
            db.ref('messages/'+curChat).push({
                sn: myData.nick,
                question: q,
                options: opts,
                type: 'poll',
                ts: Date.now()
            });
            hideModal('poll-modal');
            document.getElementById('poll-q').value = '';
            document.getElementById('poll-opts-container').innerHTML = `
                <input type="text" class="inp poll-opt-in" placeholder="Вариант 1" style="width:100%; margin-bottom:10px;">
                <input type="text" class="inp poll-opt-in" placeholder="Вариант 2" style="width:100%; margin-bottom:10px;">
            `;
        }

        async function openChatInfo() {
            const listDiv = document.getElementById('mem-list');
            const title = document.getElementById('mem-h');
            showModal('members-modal');
            
            if(curChat === 'global') {
                title.innerText = "ОНЛАЙН ПОЛЬЗОВАТЕЛИ";
                listDiv.innerHTML = '';
                const pres = await db.ref('presence').get();
                pres.forEach(p => {
                    if(p.key !== myData.nick) {
                        listDiv.innerHTML += `<div style="padding:12px; border-bottom:1px solid #222;">👤 ${p.key} <span style="color:var(--accent); float:right;">● ONLINE</span></div>`;
                    }
                });
            } else if(curChat.startsWith('group_')) {
                const group = (await db.ref('groups/'+curChat).get()).val();
                title.innerText = group.name;
                listDiv.innerHTML = '';
                
                if(group.owner === myData.nick) {
                    const btn = document.createElement('button');
                    btn.innerText = "+ ДОБАВИТЬ УЧАСТНИКОВ";
                    btn.className = "btn";
                    btn.style.background = "var(--blue)";
                    btn.style.width = "100%";
                    btn.style.marginBottom = "15px";
                    btn.onclick = () => showInviteDialog(curChat, group.members);
                    listDiv.appendChild(btn);
                }
                
                for(let m in group.members) {
                    listDiv.innerHTML += `
                        <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #222;">
                            <span>👤 ${m} ${m === group.owner ? '👑' : ''}</span>
                            ${group.owner === myData.nick && m !== myData.nick ? `<button onclick="kickMember('${m}')" style="color:red; background:none; border:none; cursor:pointer;">Кик</button>` : ''}
                        </div>
                    `;
                }
            }
        }

        async function showInviteDialog(groupId, currentMembers) {
            const listDiv = document.getElementById('mem-list');
            listDiv.innerHTML = '<h4>ВАШИ КОНТАКТЫ:</h4>';
            const friends = (await db.ref(`users/${myData.nick}/friends`).get()).val() || {};
            let hasAny = false;
            
            for(let fid in friends) {
                if(friends[fid] === 'user' && !currentMembers[fid]) {
                    hasAny = true;
                    const user = (await db.ref('users/'+fid).get()).val();
                    const div = document.createElement('div');
                    div.className = 'contact-invite-item';
                    div.innerHTML = `
                        <img src="${user.av || defAv}" style="width:40px; height:40px; border-radius:50%;">
                        <span style="flex:1;">${fid}</span>
                        <button class="btn" style="padding:5px 15px; font-size:11px; background:var(--accent); color:#000;">ДОБАВИТЬ</button>
                    `;
                    div.onclick = async () => {
                        await db.ref(`groups/${groupId}/members/${fid}`).set(true);
                        await db.ref(`users/${fid}/friends/${groupId}`).set('group');
                        alert(`${fid} добавлен в группу!`);
                        openChatInfo();
                    };
                    listDiv.appendChild(div);
                }
            }
            if(!hasAny) listDiv.innerHTML += '<p style="opacity:0.5; text-align:center;">Нет контактов для добавления</p>';
        }

        async function kickMember(nick) {
            if(confirm(`Исключить ${nick}?`)) {
                await db.ref(`groups/${curChat}/members/${nick}`).remove();
                await db.ref(`users/${nick}/friends/${curChat}`).remove();
                openChatInfo();
            }
        }

        function previewGroupAvatar(input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    groupAvatarBase64 = e.target.result;
                    document.getElementById('group-avatar-preview').src = groupAvatarBase64;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function createGroup() {
            const name = document.getElementById('g-name').value.trim();
            if(!name) return alert("Введите название!");
            const gid = 'group_' + Date.now();
            await db.ref('groups/'+gid).set({
                name: name,
                owner: myData.nick,
                av: groupAvatarBase64 || defAv,
                members: { [myData.nick]: true }
            });
            await db.ref(`users/${myData.nick}/friends/${gid}`).set('group');
            hideModal('group-modal');
            document.getElementById('g-name').value = '';
            groupAvatarBase64 = null;
            document.getElementById('group-avatar-preview').src = defAv;
            alert("Группа создана!");
        }

        function showContextMenu(e, mid, m) {
            selId = mid; selData = m;
            const menu = document.getElementById('ctx-menu');
            document.getElementById('owner-tools').classList.toggle('hidden', !(m.sn === myData.nick || myData.admin));
            menu.style.display = 'block';
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
        }

        function replyMessage() { replyData = selData; document.getElementById('action-bar').classList.remove('hidden'); document.getElementById('action-type').innerText = "ОТВЕТ"; document.getElementById('action-text').innerText = selData.sn; }
        function editMessage() { isEditing = true; document.getElementById('msg-in').value = selData.txt; document.getElementById('action-bar').classList.remove('hidden'); document.getElementById('action-type').innerText = "РЕДАКТОР"; document.getElementById('action-text').innerText = selData.txt; }
        function deleteMessage() { if(confirm("Удалить?")) db.ref(`messages/${curChat}/${selId}`).remove(); cancelAction(); }
        function cancelAction() { isEditing = false; replyData = null; document.getElementById('action-bar').classList.add('hidden'); document.getElementById('msg-in').value = ''; }
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function hideModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeCtx() { document.getElementById('ctx-menu').style.display = 'none'; }
        function addEmoji(e) { document.getElementById('msg-in').value += e; }

        async function saveSettings() {
            const key = document.getElementById('admin-key').value;
            const updates = {
                av: document.getElementById('set-pre').src,
                color: document.getElementById('set-color').value,
                admin: (key === "DanAdminPanel")
            };
            await db.ref('users/'+myData.nick).update(updates);
            myData = (await db.ref('users/'+myData.nick).get()).val();
            document.getElementById('my-name-display').innerText = myData.nick;
            document.getElementById('my-name-display').style.color = myData.color;
            document.getElementById('admin-indicator').classList.toggle('hidden', !myData.admin);
            hideModal('settings-modal');
        }

        function preview(input, targetId) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById(targetId).src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function uploadImage(input) {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    db.ref('messages/'+curChat).push({
                        sn: myData.nick,
                        txt: e.target.result,
                        type: 'img',
                        ts: Date.now()
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openSearch() {
            db.ref('users').once('value', snap => {
                const list = document.getElementById('mem-list');
                list.innerHTML = '';
                document.getElementById('mem-h').innerText = "ПОИСК ПОЛЬЗОВАТЕЛЕЙ";
                snap.forEach(u => {
                    if(u.key !== myData.nick) {
                        const div = document.createElement('div');
                        div.style.padding = "15px";
                        div.style.borderBottom = "1px solid #333";
                        div.style.cursor = "pointer";
                        div.style.display = "flex";
                        div.style.alignItems = "center";
                        div.style.gap = "10px";
                        div.innerHTML = `<img src="${u.val().av || defAv}" style="width:30px; height:30px; border-radius:50%;"><span>${u.key}</span>`;
                        div.onclick = () => { startPrivateChat(u.key); hideModal('members-modal'); };
                        list.appendChild(div);
                    }
                });
                showModal('members-modal');
            });
        }
    </script>
</body>
